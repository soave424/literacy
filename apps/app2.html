  <style>
* { box-sizing: border-box; }
:root { --border: #d8dde6; --text: #1f2937; --muted: #6b7280; --bg: #f6f8fb; --card: #ffffff; --primary: #2563eb; --primary-hover: #1d4ed8; --selected: #111827; --selected-text: #ffffff; --button-bg: #ffffff; --button-hover: #f1f5f9; --target-color: #fef08a; --target-border: #eab308; --context-color: #bfdbfe; --context-border: #3b82f6; }

.label { display: block; font-weight: 700; margin-bottom: 6px; font-size: 13px; }

.panel { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; margin-bottom: 16px; }

        ? `<button type="button" class="timer-btn" onclick="startQuestionTimer(${q.id})">⏱️ 1분 생각하기 (생각 시간 갖기)</button>`
        : `<div class="timer-running-box" data-timer="${q.id}"><span class="clock-icon">⏳</span><span class="timer-left">생각할 시간: ${remainingTime}초 남음</span>
          <div class="progress-bar-bg"><div class="progress-bar-fill" style="width: ${((60 - remainingTime) / 60) * 100}%;"></div></div></div>`)
        : `<div class="answer-box"><div class="answer-title">💡 생각해볼 점 (예시 답변)</div><div>${q.answer}</div></div>`}
      </div>
     </div>`;
   }).join("")}
  </div>
  <section class="panel" style="margin-top:16px">
   <div class="panel-title"><span>📮 내 기록 선생님께 보내기</span></div>
   <div class="start-form" style="margin-bottom:10px">
    <label>학교명<input class="num-input" id="rec-school" data-rec="school" type="text" value="${esc(state.school)}" placeholder="소일초"></label>
    <label>번호<input class="num-input" id="rec-no" data-rec="studentNo" type="text" inputmode="numeric" value="${esc(state.studentNo)}" placeholder="260601"></label>
   </div>
   <button type="button" class="big-btn" onclick="sendRecords()">📮 보내기</button>
   ${saveMsg ? `<div class="msg" style="margin-top:10px">${saveMsg}</div>` : ""}
  </section>
  ${nextHTML("처음 활동으로 돌아가기 🔄", 0)}`;
}
/* ===== 그리기 ===== */
function render() {
 const app = document.getElementById("app");
 // 다시 그려도 쓰던 칸과 커서 위치를 지킨다
 const active = document.activeElement;
 const keepId = active && active.id && (active.tagName === "TEXTAREA" || (active.tagName === "INPUT" && active.dataset && (active.dataset.rec || active.dataset.f2))) ? active.id : null;
 const selStart = keepId ? active.selectionStart : 0;
 const selEnd = keepId ? active.selectionEnd : 0;
 const st = state.currentStage;
 app.innerHTML = st === 0 ? renderStory() : st === 1 ? renderStage1() : st === 2 ? renderStage2() : st === 3 ? renderStage3() : st === 4 ? renderStage4() : renderStage5();
 if (keepId) {
  const el = document.getElementById(keepId);
  if (el) { el.focus(); try { el.setSelectionRange(selStart, selEnd); } catch (e) {} }
 }
 if (st === 4) animateMap();
 if (st > 0) {
  const bars = app.querySelectorAll(".bottom-area");
  let bar = bars[bars.length - 1];
  if (!bar) { bar = document.createElement("div"); bar.className = "bottom-area"; app.appendChild(bar); }
  bar.insertAdjacentHTML("afterbegin", `<button type="button" class="prev-btn" onclick="goPrev()">← 이전 활동</button>`);
 }
}
document.addEventListener("input", e => {
 const el = e.target;
 if (!el || !el.dataset) return;
 if (el.dataset.frame) { state.frames[el.dataset.frame] = el.value; saveState(); }
 else if (el.dataset.qid) { state.studentAnswers[el.dataset.qid] = el.value; saveState(); }
 else if (el.dataset.story) { state.story[el.dataset.story] = el.value; saveState(); }
 else if (el.dataset.s3) { state.s3[el.dataset.s3] = el.value; saveState(); }
 else if (el.dataset.s4) { state.s4[el.dataset.s4] = el.value; saveState(); }
 else if (el.dataset.rec) { state[el.dataset.rec] = el.value.trim(); saveState(); }
 else if (el.dataset.f2) { const [w, k] = el.dataset.f2.split("|"); state.f2[w] = { ...(state.f2[w] || {}), [k]: el.value }; saveState(); }
});
// Initial boot
render();
if (HAS_SERVER) { serverLoad(false); setInterval(() => serverLoad(false), 15000); }
</script>
</body>
</html>
