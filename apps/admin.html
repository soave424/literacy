  <style>
    * { box-sizing: border-box; }
    :root {
      --border: #d8dde6; --text: #1f2937; --muted: #64748b; --bg: #f6f8fb; --card: #fff;
      --primary: #2563eb; --ok: #16a34a; --warn: #d97706; --bad: #dc2626;
    }
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif; color: var(--text); background: var(--bg); line-height: 1.55; font-size: 15px; }
    .wrap { width: min(1400px, 100%); margin: 0 auto; padding: 16px; }
    header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; margin-bottom: 14px; }

    textarea { min-height: 120px; resize: vertical; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 14px; }
    .login { max-width: 420px; margin: 80px auto; text-align: center; }

    .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 9px; overflow: hidden; }

    .notice { position: fixed; top: 16px; left: 50%; transform: translateX(-50%); background: #fef3c7; border: 2px solid #f59e0b; color: #78350f; font-weight: 800; padding: 10px 18px; border-radius: 12px; z-index: 50; box-shadow: 0 6px 20px rgba(0,0,0,.12); }
    .filter { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-bottom: 8px; }

<body>
  <div class="wrap" id="app"></div>

  <script>
    /* =====================================================================
       앱 3 관리자 페이지
       - 학생 앱 주소 끝에 ?page=admin 을 붙여 엽니다.
       - 어구는 구글 시트 '앱3 어구' 탭에 저장되고, 학생 앱이 거기서 불러옵니다.
       - 쓰임: 창고(모아 두기만) · 수업(1~3단계에 나오는 어구) · 점검(4단계 '새 어구 점검' 어구, 낱말마다 2개)
       ※ 아래 뜻 이름과 세는 규칙은 학생 앱(index.html)과 같아야 합니다.
       ===================================================================== */
    const WINDOW = 2;
    const TARGET_SUFFIX = ["한", "함", "하다", "해", "했다", "하게", "하고", "된", "을", "를", "이", "가", "은", "는", "의", "에", "로", "으로", "도", "만"];
    const MEANINGS = {
      "연패": ["계속 짐", "계속 이김(우승)"],
      "반려": ["곁에서 함께 지내는 짝", "받지 않고 되돌려 보냄"],
      "무료": ["돈을 내지 않음", "지루하고 심심함"],
      "의사": ["병을 고치는 사람", "나라를 위해 목숨 바친 사람", "무엇을 하려는 생각"]
    };
    const TARGETS = Object.keys(MEANINGS);
    const WORD_COLORS = { "연패": "#e11d48", "무료": "#2563eb", "반려": "#16a34a", "의사": "#9333ea" };
    const MEANING_COLORS = ["#4f46e5", "#f59e0b", "#16a34a"];
    const GROUP_COLORS = ["#7c3aed", "#0d9488", "#db2777", "#ea580c", "#0891b2", "#65a30d", "#be123c", "#4338ca"];
    const SHORT = ["①", "②", "③"];
    const MAX_LESSON = 12;   // 2단계에서 줄을 손으로 옮기기 좋은 최대 어구 수
    const MAX_CHECK = 2, BASE_WEIGHT = 2, TEACH_MAX = 3;
    const USES = ["창고", "수업", "점검"];
    const USE_LABEL = { "창고": "창고", "수업": "수업", "점검": "점검" };

    // 시트가 비어 있을 때 넣어 두는 선생님 예시 어구 (지금 학생 앱에 들어 있는 어구와 같음)
    const EXAMPLES = {
      "반려": { lesson: [["우리 집 반려 강아지 산책", 1], ["학교 신청서 반려 이유", 2], ["반려 강아지 사료 고르기", 1], ["보고서 반려 이유 설명", 2], ["반려 고양이 사료 걱정", 1], ["결재 서류 반려 통보", 2], ["새 반려 고양이 입양", 1], ["보고서 반려 통보 받음", 2]],
        checks: [["강아지 사료 서류 반려", 2, ""], ["반려 거북이 수조 청소", 1, ""]] },
      "무료": { lesson: [["주말 박물관 무료 입장", 1], ["할 일 없는 무료한 오후", 2], ["놀이공원 무료 입장 행사", 1], ["비 오는 날 무료한 오후", 2], ["음료 무료 쿠폰 행사", 1], ["방학 내내 무료한 오후", 2], ["배송비 무료 쿠폰", 1], ["심심하고 무료한 오후", 2]],
        checks: [["행사 없는 무료한 하루", 2, ""], ["무료한 오후 산책", 2, ""]] },
      "의사": { lesson: [["동네 병원 의사 진료", 1], ["안중근 의사 기념관", 2], ["반대 의사 표현", 3], ["치과 의사 진료", 1], ["윤봉길 의사 기념관 견학", 2], ["찬성 의사 표현", 3], ["소아과 의사 진료 시간", 1], ["독립운동가 안중근 의사 이야기", 2], ["참가 의사 표현 하기", 3]],
        checks: [["기념관 반대 의사", 3, ""], ["한의원 의사 선생님", 1, ""]] },
      "연패": { lesson: [["축구부 연패 탈출 작전", 1], ["대회 3 연패 우승", 2], ["야구부 연패 탈출 성공", 1], ["올림픽 2 연패 금메달", 2], ["긴 연패 늪 탈출", 1], ["줄넘기 대회 2 연패 달성", 2], ["농구부 긴 연패 늪", 1], ["세계 대회 연패 금메달", 2]],
        checks: [["올림픽 연패 충격", 1, ""], ["대회 연패 탈출", 1, ""]] }
    };
    function exampleRows() {
      const rows = [];
      TARGETS.forEach(t => {
        EXAMPLES[t].lesson.forEach(([text, c]) => rows.push(newRow({ cls: "예시", group: "", word: t, code: c, text, use: "수업" })));
        EXAMPLES[t].checks.forEach(([text, c, learned]) => rows.push(newRow({ cls: "예시", group: "", word: t, code: c, text, use: "점검", learned })));
      });
      return rows;
    }

    const HAS_SERVER = typeof google !== "undefined" && google.script && google.script.run;
    const LOCAL_KEY = "app3_admin_rows_v1";

    let pw = "", appUrl = "", loggedIn = false, loginErr = "", firstTime = false, busy = false;
    let rows = [], dirty = false, saveMsg = "";
    let curWord = TARGETS[0], filter = "전체", pasteText = "", pastePreview = null;
    let uid = 1;
    function newRow(o) { return { learned: String(o.learned || ""), id: uid++, cls: String(o.cls || ""), group: String(o.group || ""), word: o.word, code: Number(o.code) || 0, text: String(o.text || "").trim(), orig: String(o.orig || ""), use: o.use || "창고" }; }

    /* ===== 세는 규칙 (학생 앱과 같음) ===== */
    function esc(v) { return String(v == null ? "" : v).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
    function tokensOf(text) { return String(text || "").trim().split(/\s+/).map(t => t.replace(/[.,!?~"'“”‘’()\[\]…·:;]/g, "")).filter(Boolean); }
    function isTarget(tok, t) { return tok === t || (tok.startsWith(t) && TARGET_SUFFIX.includes(tok.slice(t.length))); }
    function isClueWord(w) { return !/^\d+$/u.test(w); }
    function clueWords(words) { return words.filter(isClueWord); }
    function contextOf(text, t) {
      const toks = tokensOf(text);
      const tIdx = toks.map((x, i) => isTarget(x, t) ? i : -1).filter(i => i >= 0);
      const ctx = [];
      tIdx.forEach(i => { for (let j = Math.max(0, i - WINDOW); j <= Math.min(toks.length - 1, i + WINDOW); j++) if (!tIdx.includes(j)) ctx.push(toks[j]); });
      return { toks, tIdx, ctx };
    }
    function shareWords(a, b) { return [...new Set(a.filter(w => b.includes(w)))]; }
    function clueScoreTable(list, t) {
      const meaningCount = MEANINGS[t].length, counts = {};
      list.forEach(r => contextOf(r.text, t).ctx.filter(isClueWord).forEach(w => {
        if (!counts[w]) counts[w] = Array(meaningCount).fill(0);
        if (r.code >= 1 && r.code <= meaningCount) counts[w][r.code - 1]++;
      }));
      const table = {};
      Object.entries(counts).forEach(([w, values]) => {
        const total = values.reduce((a, b) => a + b, 0);
        if (total) table[w] = values.map(v => v / total);
      });
      return table;
    }
    function groupsOf(list, t) {
      const C = list.map(r => contextOf(r.text, t).ctx), n = C.length, p = C.map((_, i) => i);
      const f = x => p[x] === x ? x : (p[x] = f(p[x]));
      for (let i = 0; i < n; i++) for (let j = i + 1; j < n; j++) if (shareWords(C[i], C[j]).length) p[f(i)] = f(j);
      const map = {}, groups = [];
      for (let i = 0; i < n; i++) { const r = f(i); if (map[r] == null) { map[r] = groups.length; groups.push([]); } groups[map[r]].push(i); }
      return { C, groups };
    }
    function judge(list, t, text) {
      const { C, groups } = groupsOf(list, t), ctx = contextOf(text, t).ctx;
      const hits = groups.map(g => [...new Set(ctx.filter(x => g.some(i => C[i].includes(x))))]);
      const scores = groups.map(g => ctx.reduce((a, x) => a + g.reduce((b, i) => b + C[i].filter(y => y === x).length, 0), 0));
      const max = Math.max(0, ...scores), tops = scores.map((s, i) => s === max ? i : -1).filter(i => i >= 0);
      if (!groups.length || max === 0) return { kind: "unknown", ctx };
      if (tops.length > 1) return { kind: "tie", ctx, words: [...new Set(tops.flatMap(i => hits[i]))] };
      const g = groups[tops[0]], cnt = {};
      g.forEach(i => { cnt[list[i].code] = (cnt[list[i].code] || 0) + 1; });
      const code = +Object.keys(cnt).sort((a, b) => cnt[b] - cnt[a])[0];
      return { kind: "pick", ctx, words: hits[tops[0]], code, mixed: Object.keys(cnt).length > 1 };
    }

    /* ===== 점검 표시 ===== */
    const PARTICLE_HINT = ["께서", "에게", "에서", "으로", "에는", "에도", "까지", "부터", "을", "를", "께", "가"];
    function particleHint(tok) {
      for (const p of PARTICLE_HINT) if (tok.endsWith(p) && tok.length >= p.length + (p.length === 1 ? 2 : 1)) return p;
      return null;
    }
    function norm(s) { return tokensOf(s).join(" "); }
    function flagsOf(r) {
      const out = [];
      if (!TARGETS.includes(r.word)) { out.push({ lv: "bad", msg: "낱말이 연패·반려·무료·의사가 아니에요" }); return out; }
      if (!(r.code >= 1 && r.code <= MEANINGS[r.word].length)) out.push({ lv: "bad", msg: "뜻코드를 확인해 주세요" });
      const c = contextOf(r.text, r.word);
      if (!c.tIdx.length) {
        const glued = c.toks.find(x => x.includes(r.word));
        out.push({ lv: "bad", msg: glued ? `'${glued}'처럼 붙어 있어서 컴퓨터가 '${r.word}'을(를) 못 찾아요. 띄어 써 주세요.` : `어구에 '${r.word}'이(가) 없어요` });
      } else if (!c.ctx.length) out.push({ lv: "bad", msg: "옆 말이 없어요" });
      const hinted = c.toks.filter((x, i) => !c.tIdx.includes(i) && particleHint(x));
      if (hinted.length) out.push({ lv: "warn", msg: `조사가 붙었는지 확인: ${hinted.map(x => `'${x}'`).join(", ")}`, fix: true });
      const dup = rows.some(o => o.id !== r.id && o.word === r.word && norm(o.text) === norm(r.text));
      if (dup) out.push({ lv: "mute", msg: "같은 어구가 또 있어요" });
      return out;
    }
    function usable(r) { return !flagsOf(r).some(f => f.lv === "bad"); }

    /* ===== 데이터 다루기 ===== */
    function wordRows(t) { return rows.filter(r => r.word === t); }
    function lessonRows(t) { return wordRows(t).filter(r => r.use === "수업" && usable(r)); }
    function checkRows(t) { return wordRows(t).filter(r => r.use === "점검"); }
    function setUse(id, use) {
      const r = rows.find(x => x.id === id); if (!r) return;
      if (use !== "창고" && !usable(r)) { notice("⚠️ 빨간 표시를 먼저 고쳐 주세요."); return; }
      if (use === "점검" && r.use !== "점검" && checkRows(r.word).length >= MAX_CHECK) { notice(`⚠️ 점검 어구는 ${MAX_CHECK}개까지예요. 하나를 먼저 창고로 빼 주세요.`); return; }
      r.use = use;
      markDirty(); render();
    }
    function editText(id, v) {
      const r = rows.find(x => x.id === id); if (!r) return;
      if (!r.orig) r.orig = r.text;
      r.text = v.replace(/\s+/g, " ").trim();
      if (r.orig === r.text) r.orig = "";
      markDirty(); render();
    }
    function stripParticles(id) {
      const r = rows.find(x => x.id === id); if (!r) return;
      const toks = tokensOf(r.text).map(x => { if (isTarget(x, r.word)) return x; const p = particleHint(x); return p ? x.slice(0, -p.length) : x; });
      editText(id, toks.join(" "));
    }
    let pendingDel = null;
    function delRow(id) { if (pendingDel !== id) { pendingDel = id; render(); return; } pendingDel = null; rows = rows.filter(r => r.id !== id); markDirty(); saveMsg = "어구를 지웠어요. 저장해야 시트에서도 지워져요."; render(); }
    let noticeMsg = "";
    function notice(m) { noticeMsg = m; render(); setTimeout(() => { if (noticeMsg === m) { noticeMsg = ""; render(); } }, 3500); }
    function markDirty() { dirty = true; saveMsg = ""; }

    /* ===== 붙여넣기 ===== */
    function parseDelimitedRows(text, delimiter) {
      const input = String(text || "").replace(/^\uFEFF/, "");
      const result = [], row = [];
      let field = "", quoted = false;
      for (let i = 0; i < input.length; i++) {
        const ch = input[i];
        if (quoted) {
          if (ch === '"' && input[i + 1] === '"') { field += '"'; i++; }
          else if (ch === '"') quoted = false;
          else field += ch;
        } else if (ch === '"' && !field) quoted = true;
        else if (ch === delimiter) { row.push(field.trim()); field = ""; }
        else if (ch === "\n") {
          row.push(field.trim().replace(/\r$/, "")); field = "";
          if (row.some(value => value !== "")) result.push([...row]);
          row.length = 0;
        } else field += ch;
      }

    function parsePaste(text) {

      const delimiter = input.split(/\r?\n/, 1)[0].includes("\t") ? "\t" : ",";
      const table = parseDelimitedRows(input, delimiter);
      let cols = null, start = 0;
      const head = table[0].map(x => x.trim());
      if (head.some(h => /어구|문장|단어|낱말|뜻/.test(h))) {
        const find = re => head.findIndex(h => re.test(h));
        cols = { cls: find(/^반$/), group: find(/모둠/), word: find(/단어|낱말/), code: find(/뜻/), text: find(/어구|문장/) };
        start = 1;
      }
      const add = [], bad = [];
      let dup = 0;
      const seen = new Set(rows.map(r => r.word + "|" + norm(r.text)));
      for (let k = start; k < table.length; k++) {
        const c = table[k];
        let o;
        if (cols) o = { cls: c[cols.cls] || "", group: c[cols.group] || "", word: c[cols.word] || "", code: c[cols.code] || "", text: c[cols.text] || "" };
        else if (c.length >= 5) o = { cls: c[0], group: c[1], word: c[2], code: c[3], text: c.slice(4).join(" ") };
        else if (c.length === 3) o = { cls: "", group: "", word: c[0], code: c[1], text: c[2] };
        else { bad.push(c.join(delimiter)); continue; }
        const codeStr = String(o.code).replace(/\s/g, "");
        if (!o.word) o.word = TARGETS.find(t => codeStr.startsWith(t)) || "";
        const num = Number((codeStr.match(/(\d+)\s*$/) || [])[1]);
        if (!TARGETS.includes(o.word) || !num || !o.text) { bad.push(c.join(delimiter)); continue; }
        const key = o.word + "|" + norm(o.text);
        if (seen.has(key)) { dup++; continue; }
        seen.add(key);
        add.push(newRow({ ...o, code: num, use: "창고" }));
      }
      return { add, dup, bad };
    }

    /* ----- (예전 4단계 '컴퓨터 가르치기'용 함수, 지금은 쓰지 않음) -----

    function parseLearned(t, str) {

          <button class="btn" type="button" onclick="document.getElementById('csvFile').click()">CSV 파일 선택</button>
          <p class="note">열 제목: 반, 모둠, 단어, 뜻코드, 어구. 가져온 자료는 창고에 추가되고 학생 앱에는 자동 적용되지 않아요.</p>
          <textarea id="paste" placeholder="반	모둠	단어	뜻코드	어구&#10;102	6	연패	연패1	3년 연패 탈출">${esc(pasteText)}</textarea>
          <div style="margin-top:8px; display:flex; gap:8px; flex-wrap:wrap">
            <button class="btn primary" onclick="previewPaste()">표로 읽기</button>
            ${pastePreview ? `<button class="btn save" onclick="confirmPaste()" ${pastePreview.add.length ? "" : "disabled"}>창고에 넣기 (${pastePreview.add.length}개)</button><button class="btn" onclick="cancelPaste()">취소</button>` : ""}
          </div>
          ${pastePreview ? `<div class="paste-sum">새 어구 ${pastePreview.add.length}개 ${TARGETS.map(w => { const n = pastePreview.add.filter(r => r.word === w).length; return n ? `· ${w} ${n}` : ""; }).join(" ")}
              ${pastePreview.dup ? ` · 이미 있어서 뺀 것 ${pastePreview.dup}개` : ""}
              ${pastePreview.bad.length ? `<div class="flag bad">읽지 못한 줄 ${pastePreview.bad.length}개: ${pastePreview.bad.slice(0, 3).map(esc).join(" / ")}${pastePreview.bad.length > 3 ? " …" : ""}</div>` : ""}</div>` : ""}
        </div>

        <div class="tabs">${TARGETS.map(w => `<button class="tab ${w === t ? "on" : ""}" style="border-color:${WORD_COLORS[w]}; ${w === t ? `background:${WORD_COLORS[w]}` : `color:${WORD_COLORS[w]}`}" onclick="setWord('${w}')">${w}<span class="st">${tabStatus(w)}</span></button>`).join("")}</div>

        <div class="grid">
          <div class="card" style="padding:12px">
            <div class="filter">
              ${["전체", "수업", "점검", "창고", "문제"].map(f => `<button class="btn small ${filter === f ? "on" : ""}" onclick="setFilter('${f}')">${f === "문제" ? "⚠️ 확인할 것" : (USE_LABEL[f] || f)} ${f === "전체" ? all.length : f === "문제" ? all.filter(r => flagsOf(r).some(x => x.lv !== "mute")).length : cnt(f)}</button>`).join("")}
            </div>
            <div style="max-height:70vh; overflow:auto">
            <table>
              <thead><tr><th>쓰임</th><th>뜻</th><th>어구</th><th>반·모둠</th><th>수업에 넣으면 / 컴퓨터 판단</th><th></th></tr></thead>
              <tbody>${shown.map(r => {
                const fl = flagsOf(r);
                return `<tr class="use-${r.use}">
                  <td><span class="seg">${USES.map(u => `<button class="u-${u} ${r.use === u ? "on" : ""}" onclick="setUse(${r.id},'${u}')">${USE_LABEL[u]}</button>`).join("")}</span></td>
                  <td>${codePill(t, r.code)}</td>
                  <td class="phr"><input type="text" value="${esc(r.text)}" onchange="editText(${r.id}, this.value)">
                    ${r.orig ? `<div class="orig">원래: ${esc(r.orig)}</div>` : ""}
                    ${fl.map(f => `<div class="flag ${f.lv}">${f.lv === "bad" ? "⛔" : f.lv === "warn" ? "⚠️" : "ℹ️"} ${esc(f.msg)} ${f.fix ? `<button class="btn small" onclick="stripParticles(${r.id})">조사 떼기</button>` : ""}</div>`).join("")}</td>
                  <td class="note">${esc(r.cls)}${r.group ? `·${esc(r.group)}` : ""}</td>
                  <td>${r.use === "창고" ? effectOf(r, A) + "<br>" + (usable(r) ? judgeLabel(t, A, r.text, r.code) : "") : r.use === "점검" && usable(r) ? sceneLabel(t, A, r) : ""}</td>
                  <td>${pendingDel === r.id ? `<button class="btn small" style="color:#dc2626;border-color:#fca5a5" onclick="delRow(${r.id})">지우기</button>` : `<button class="del" title="지우기" onclick="delRow(${r.id})">🗑️</button>`}</td>
                </tr>`;
              }).join("") || `<tr><td colspan="6" class="note">어구가 없어요.</td></tr>`}</tbody>
            </table></div>
          </div>

          <div>
            <div class="card">
              <h2>🤖 컴퓨터는 수업 어구 ${A.list.length}개를 이렇게 나눠요</h2>
              ${A.ready
                ? `<div class="status ok">✅ 덩어리 ${A.groups.length}개, 뜻마다 하나씩 나뉘어요. 수업에 쓸 수 있어요.</div>`
                : `<div class="status warn">⚠️ 아직 학생 앱에 쓰기 어려워요. (저장해도 이 낱말은 원래 예시 어구가 나와요)<ul>${A.problems.map(p => `<li>${esc(p)}</li>`).join("")}</ul></div>`}
              ${A.info.map((x, gi) => `
                <div class="group" style="border-color:${GROUP_COLORS[gi % GROUP_COLORS.length]}">
                  <h4><span class="pill" style="background:${GROUP_COLORS[gi % GROUP_COLORS.length]}">덩어리 ${gi + 1}</span> 어구 ${x.g.length}개 ${x.codes.length > 1 ? `<span class="flag bad">⛔ 뜻 ${x.codes.length}개가 섞였어요</span>` : codePill(t, x.codes[0])}</h4>
                  <ul>${x.g.map(i => `<li>${phraseHTML(t, A.list[i].text)} ${x.codes.length > 1 ? codePill(t, A.list[i].code) : ""}</li>`).join("")}</ul>
                  ${x.bridges.slice(0, 4).map(b => `<div class="bridge">🌉 다리 말 <b>${b.w.map(esc).join(", ")}</b>: “${esc(b.a.text)}” ${SHORT[b.a.code - 1]} ↔ “${esc(b.b.text)}” ${SHORT[b.b.code - 1]}</div>`).join("")}
                </div>`).join("") || `<p class="note">수업 어구를 고르면 여기에 덩어리가 나와요.</p>`}
            </div>
            <div class="card">
              <h2>🧑‍🏫 4단계 새 어구 점검 (어구 ${cks.length}/${MAX_CHECK})</h2>
              ${cks.length ? cks.map(r => `<div class="judge"><div style="font-size:16px">🆕 ${phraseHTML(t, r.text)} ${codePill(t, r.code)}</div>${usable(r) ? sceneLabel(t, A, r) : `<span class="flag bad">⛔ 이 어구는 고쳐야 해요</span>`}</div>`).join("")
                : `<p class="note">학생이 먼저 뜻을 고른 뒤 컴퓨터의 판단을 볼 어구를 1~2개 '점검'으로 골라 주세요.</p>`}
              <p class="note" style="margin-top:8px">학생은 ① 먼저 뜻을 고르고 ② [컴퓨터는?]으로 컴퓨터의 판단을 본 뒤 ③ 그대로 둘지 고칠지 정하고 근거를 써요. 컴퓨터는 위 수업 어구로 나눈 덩어리를 보고 판단해요. 서로 다른 장면(짐작 · 헷갈려요 · 모르겠어요)이 나오게 고르면 좋아요. 컴퓨터가 틀리거나 못 고르는 어구는 6차시 '원인 찾기' 자료가 돼요.</p>
            </div>
          </div>
        </div>

        ${noticeMsg ? `<div class="notice">${esc(noticeMsg)}</div>` : ""}
        <div class="savebar">
          <button class="btn save" onclick="saveAll()" ${busy ? "disabled" : ""}>💾 저장</button>
          ${dirty ? `<span class="dirty">● 저장하지 않은 변경이 있어요</span>` : ""}
          <span>${esc(saveMsg)}</span>
          ${HAS_SERVER ? "" : `<span class="note">(미리보기: 시트 대신 이 브라우저에 저장돼요. 비밀번호는 아무거나 넣어도 들어가요)</span>`}
        </div>`;
    }
    // 학생 앱의 첫 화면(학교명·번호 입력)으로
    function startUrl() { if (window.GAS_BRIDGE) return "app3.html?start=1"; if (!HAS_SERVER) return "app3.html#start"; return appUrl ? appUrl + (appUrl.includes("?") ? "&" : "?") + "start=1" : "?start=1"; }
    function studentUrl() { if (window.GAS_BRIDGE || !HAS_SERVER) return "app3.html"; if (appUrl) return appUrl; try { const u = new URL(window.location.href); u.searchParams.delete("page"); return u.toString(); } catch (e) { return "?"; } }
    function setWord(w) { curWord = w; filter = "전체"; render(); }
    function setFilter(f) { filter = f; render(); }
    function render() {
      const y = window.scrollY;
      document.getElementById("app").innerHTML = loggedIn ? (busy && !rows.length ? `<div class="card">불러오는 중…</div>` : renderMain()) : renderLogin();
      window.scrollTo({ top: y });
      if (!loggedIn) { const el = document.getElementById("pw"); if (el) el.focus(); }
    }
    window.addEventListener("beforeunload", e => { if (dirty) { e.preventDefault(); e.returnValue = ""; } });
    render();
  </script>
</body>
</html>
