          body += `<div class="wl-step">두 '${esc(w)}'의 주변 단어 중에서, 뜻을 알려 주는 말을 눌러 밑줄을 그어요.</div>
            ${occ.map((o, i) => `<div class="snip clickable">${i + 1}. ${snippetHTML(o, true)}</div>`).join("")}
            ${occ.every(o => clueWordsOf(o).length) ? `<button type="button" class="big-btn" style="margin-top:6px" onclick="setStoryStep('${w}',2)">다음: 단서 견주기 →</button>` : `<div class="wl-hint">두 문장 모두 밑줄을 하나 이상 그어 보세요.</div>`}`;
        }
        if (step === 2) {
          const cmp = storySub("cmp")[w];
          body += `<div class="wl-step">밑줄 친 단어를 나란히 놓아 봐요.</div>
            <div class="cmp-grid">${occ.map((o, i) => `<div class="cmp-col"><div class="occ-no">${i + 1}번 '${esc(w)}' 주변</div>${clueWordsOf(o).map(x => `<span class="cmp-chip">${esc(x)}</span>`).join("")}</div>`).join("")}</div>
            <div class="wl-step">두 '${esc(w)}'의 주변 단어는?</div>
            <div class="m-pick">
              <button type="button" class="m-btn ${cmp === "similar" ? "on" : ""}" style="${cmp === "similar" ? "background:#334155;border-color:#334155" : ""}" onclick="setCmp('${w}','similar')">비슷해요</button>
              <button type="button" class="m-btn ${cmp === "different" ? "on" : ""}" style="${cmp === "different" ? "background:#334155;border-color:#334155" : ""}" onclick="setCmp('${w}','different')">서로 달라요</button></div>
            ${cmp ? `<button type="button" class="big-btn" style="margin-top:8px" onclick="setStoryStep('${w}',3)">다음: 다시 짐작하고 점검하기 →</button>` : ""}`;
        }
        if (step === 3) {
          body += `<div class="wl-step">밑줄 친 단어를 근거로 다시 짐작해요. 처음 짐작을 그대로 둘까요, 고칠까요?</div>
            ${occ.map((o, i) => {
              const k = keep[o.id], finalId = k === "keep" ? first[o.id] : fin[o.id];
              return `<div class="occ-row">
                <div class="snip">${i + 1}. ${snippetHTML(o, false)}</div>
                <div class="q-line" style="margin:4px 0">처음 짐작: ${pill(w, first[o.id])}</div>
                <div class="m-pick">
                  <button type="button" class="m-btn sm ${k === "keep" ? "on" : ""}" style="${k === "keep" ? "background:#7c3aed;border-color:#7c3aed" : ""}" onclick="setKeepOcc('${o.id}','keep')">그대로 둘래요</button>
                  <button type="button" class="m-btn sm ${k === "fix" ? "on" : ""}" style="${k === "fix" ? "background:#7c3aed;border-color:#7c3aed" : ""}" onclick="setKeepOcc('${o.id}','fix')">고칠래요</button>
                  ${checked && finalId ? `<span class="mark">${finalId === o.answer ? "✅" : "❌"}</span>` : ""}</div>
                ${k === "fix" ? `<div class="m-pick" style="margin-top:4px">${meanBtns(o, "mean", "setFinalMean")}</div>` : ""}
              </div>`;
            }).join("")}
            <div class="frame-tpl" style="margin-top:6px">${FRAMES[4]}</div>
            <textarea class="why-input" data-meanwhy="${w}" rows="2" placeholder="처음에는 ○○라고 생각했는데, △△를 읽고 □□로 고쳤다(또는 그대로 두었다).">${esc(storySub("meanWhy")[w] || "")}</textarea>
            ${occ.every(o => finalOf(o)) ? `<button type="button" class="action-btn" style="margin-top:6px" onclick="checkStoryWord('${w}')">${checked ? "✔ 확인했어요" : "✔ 확인"}</button>` : ""}
            ${checked && occ.some(o => finalOf(o) !== o.answer) ? `<div class="wl-hint" style="color:#b45309">❌ 표시된 곳은 밑줄 친 단어를 다시 읽고 고쳐 보세요.</div>` : ""}`;
        }
        if (step > 0) body += `<button type="button" class="teacher-skip" style="margin-top:8px" onclick="setStoryStep('${w}',${step - 1})">← 앞 단계로</button>`;
      }
      return `<div class="wl-card ${n === occ.length && !isOpen ? "closed" : ""}" style="border-color:${n === occ.length ? WORD_COLORS[w] : "var(--border)"}" ${n === occ.length && !isOpen ? `onclick="openWord('${w}')"` : ""}>
          <div class="wl-head"><span class="wl-word" style="color:${WORD_COLORS[w]}">${esc(w)}</span><span class="dots">${dots}</span></div>
          ${body}</div>`;
    }

    function finalOf(o) { const k = storySub("keep")[o.id]; return k === "keep" ? storySub("first")[o.id] : k === "fix" ? storySub("mean")[o.id] : undefined; }
    function openWord(w) { S().open = w; saveState(); keepScrollRender(); }
    function voteSame(w, v) { storySub("same")[w] = v; saveState(); sendVote(`same:${w}`, v); keepScrollRender(); }
    function setFirstMean(occId, id) { storySub("first")[occId] = id; saveState(); keepScrollRender(); }
    function setStoryStep(w, s) { storySub("step")[w] = s; saveState(); keepScrollRender(); }
    function toggleStoryClue(occId, tokId) { const c = storySub("clues"); const a = c[occId] || []; c[occId] = a.includes(tokId) ? a.filter(x => x !== tokId) : [...a, tokId]; saveState(); keepScrollRender(); }
    function setCmp(w, v) { storySub("cmp")[w] = v; saveState(); keepScrollRender(); }
    function setKeepOcc(occId, v) { storySub("keep")[occId] = v; storySub("checked")[storyTokens().find(x => x.id === occId).word] = false; saveState(); keepScrollRender(); }
    function setFinalMean(occId, id) { storySub("mean")[occId] = id; storySub("checked")[storyTokens().find(x => x.id === occId).word] = false; saveState(); keepScrollRender(); }
    function checkStoryWord(w) {
      storySub("checked")[w] = true;
      if (occsOf(w).every(o => finalOf(o) === o.answer)) { const next = storyWords().find(x => !storySub("checked")[x] && foundCount(x) === occsOf(x).length); if (next) S().open = next; }
      saveState(); keepScrollRender();
    }

    // ④ 점검: 한 문장씩 열고 우리 반 의견 보기 ⑤ 다리 질문
    function storyCheckHTML() {
      const c = STORY.check, ck = storySub("chk"), w = c.word, ms = LEXICON[w].meanings;
      const opts = ms.map((m, mi) => ({ label: `${SHORT[mi]} ${m.name}`, v: m.id, color: MEANING_COLORS[mi] }));
      const btns = (field, fn) => ms.map((m, mi) => `<button type="button" class="m-btn ${ck[field] === m.id ? "on" : ""}" style="${ck[field] === m.id ? `background:${MEANING_COLORS[mi]};border-color:${MEANING_COLORS[mi]}` : ""}" onclick="${fn}('${m.id}')">${SHORT[mi]} ${esc(m.name)}</button>`).join("");
      const finalId = ck.keep === "keep" ? ck.m1 : ck.m2;
      return `
        <section class="class-panel">
          <div class="class-head"><div>
            <span class="class-badge">새 문장 점검하기</span>
            <h2>🔍 이 '${esc(w)}'은(는) 어떤 뜻일까?</h2>
            <p>문장을 하나씩 열어요. 새 문장을 읽고 생각이 바뀌면 고쳐도 돼요.</p></div></div>
          <div class="check-card">
            <div class="q">${STORY.check.s1.split(" ").map(x => x.includes(w) ? `<b class="snip-target" style="--wc:${WORD_COLORS[w]}">${esc(x)}</b>` : esc(x)).join(" ")}</div>
            <div class="step-title">① 내 생각</div>
            <div class="m-pick">${btns("m1", "setChk1")}</div>
            ${ck.m1 ? `<div class="m-pick" style="margin-top:6px">
                <button type="button" class="m-btn sm ${ck.conf === "half" ? "on" : ""}" style="${ck.conf === "half" ? "background:#64748b;border-color:#64748b" : ""}" onclick="setConf('half')">🤔 반반이에요</button>
                <button type="button" class="m-btn sm ${ck.conf === "sure" ? "on" : ""}" style="${ck.conf === "sure" ? "background:#64748b;border-color:#64748b" : ""}" onclick="setConf('sure')">🙂 확실해요</button></div>
              <div class="step-title">우리 반 생각</div>${barChart(opts, "chk1")}` : ""}
            ${ck.m1 && !ck.open2 ? `<button type="button" class="big-btn" style="margin-top:12px" onclick="openChk2()">다음 문장 열기 →</button>` : ""}
            ${ck.open2 ? `
              <div class="q" style="margin-top:14px">➕ ${esc(STORY.check.s2)}</div>
              <div class="step-title">② 처음 생각을 그대로 둘까, 고칠까?</div>
              <div class="m-pick" style="margin-bottom:8px">
                <button type="button" class="big-btn light ${ck.keep === "keep" ? "on" : ""}" onclick="setChkKeep('keep')">그대로 둘래요</button>
                <button type="button" class="big-btn light ${ck.keep === "fix" ? "on" : ""}" onclick="setChkKeep('fix')">고칠래요</button></div>
              ${ck.keep === "fix" ? `<div class="m-pick" style="margin-bottom:8px">${btns("m2", "setChk2")}</div>` : ""}
              ${finalId ? `<div class="step-title">우리 반 생각 (새 문장을 읽은 뒤)</div>${barChart(opts, "chk2")}
                <textarea class="why-input" data-chkwhy="1" rows="2" style="margin-top:8px" placeholder="${esc(FRAMES[4])}">${esc(ck.why || "")}</textarea>` : ""}` : ""}
          </div>
        </section>
        ${ck.open2 && finalId ? `
        <section class="class-panel">
          <div class="class-head"><div>
            <span class="class-badge">컴퓨터라면?</span>
            <h2>🤖 컴퓨터는 이 글의 '연패' 두 개를 처음에 어떻게 볼까?</h2>
            <p>예측만 해 두세요. 답은 3단계 단어 지도에서 확인해요.</p></div></div>
          <div class="m-pick">
            <button type="button" class="big-btn light ${S().predict === "same" ? "on" : ""}" onclick="setPredict('same')">같은 것으로 본다</button>
            <button type="button" class="big-btn light ${S().predict === "diff" ? "on" : ""}" onclick="setPredict('diff')">다른 뜻으로 나눈다</button>
          </div>
        </section>` : ""}`;
    }
    function setChk1(id) { const c = storySub("chk"); if (c.open2) return; c.m1 = id; saveState(); sendVote("chk1", id); keepScrollRender(); }
    function setConf(v) { storySub("chk").conf = v; saveState(); keepScrollRender(); }
    function openChk2() { storySub("chk").open2 = true; saveState(); keepScrollRender(); }
    function setChkKeep(v) { const c = storySub("chk"); c.keep = v; if (v === "keep") { c.m2 = c.m1; sendVote("chk2", c.m1); } saveState(); keepScrollRender(); }
    function setChk2(id) { const c = storySub("chk"); c.m2 = id; saveState(); sendVote("chk2", id); keepScrollRender(); }
    function setPredict(v) { S().predict = v; saveState(); keepScrollRender(); }

    /* ===== 우리 반 투표 (구글 시트로 배포했을 때 모임) ===== */
    let votes = {};   // votes[질문][답] = 사람 수
    function classKey() { return `${state.school}|${String(state.studentNo).slice(0, CLASS_KEY_LENGTH)}`; }
    function myVote(key) {
      const s = S();
      if (key.startsWith("same:")) return (s.same || {})[key.slice(5)];
      if (key === "chk1") return (s.chk || {}).m1;
      if (key === "chk2") { const c = s.chk || {}; return c.keep === "keep" ? c.m1 : c.m2; }
    }
    function voteCounts(key) {
      if (HAS_SERVER) return votes[key] || {};
      const v = myVote(key); return v ? { [v]: 1 } : {};
    }
    function barChart(opts, key, color) {
      const counts = voteCounts(key), total = opts.reduce((a, o) => a + (counts[o.v] || 0), 0);
      return `<div class="vote-chart">${opts.map(o => {
          const n = counts[o.v] || 0, pctv = total ? Math.round(n / total * 100) : 0;
          return `<div class="vbar-row"><span class="vbar-label">${esc(o.label)}</span>
            <span class="vbar-track"><span class="vbar-fill" style="width:${pctv}%; background:${o.color || color || "#64748b"}"></span></span>
            <span class="vbar-n">${n}명</span></div>`;
        }).join("")}
        <div class="vbar-note">${HAS_SERVER ? `우리 반 ${total}명이 답했어요.` : "지금은 내 답만 보여요. 선생님이 시트로 배포하면 우리 반 결과가 모여요."}</div></div>`;
    }
    function sendVote(key, value) {
      if (!HAS_SERVER || !state.studentNo) return;
      google.script.run.withSuccessHandler(v => { votes = v || {}; if (state.currentStage === 0) keepScrollRender(); })
        .saveApp3Vote({ school: state.school, no: state.studentNo, classKey: classKey(), key, value });
    }
    function loadVotes() {
      if (!HAS_SERVER || !state.studentNo) return;
      google.script.run.withSuccessHandler(v => {
        const changed = JSON.stringify(v || {}) !== JSON.stringify(votes);
        votes = v || {};
        const a = document.activeElement;
        if (changed && state.currentStage === 0 && !(a && (a.tagName === "TEXTAREA" || a.tagName === "INPUT"))) keepScrollRender();
      }).getApp3Votes(classKey());
    }

    /* ===== 1단계: 문맥 살피기 ===== */
    function renderStage1() {
      const t = state.currentTarget, L = LEXICON[t], f = sub("first", t);
      const done = L.sentences.filter((s, i) => f[i] && f[i].m).length;
      return `${headerHTML(1)}${aiCardHTML(1)}${toolsHTML()}
        <section class="panel">
          <div class="panel-title"><span>'${esc(t)}'이(가) 든 문장 읽기 (${done}/${L.sentences.length})</span>
            <div class="legend">
              <div class="legend-item"><div class="legend-box target"></div> 목표 낱말</div>
              <div class="legend-item"><div class="legend-box" style="background:#dcfce7;border-color:#16a34a"></div> 내가 고른 단서</div>
              ${state.showWin ? `<div class="legend-item"><div class="legend-box context"></div> 컴퓨터의 윈도우 (양옆 ${WINDOW}칸)</div>` : ""}
            </div></div>
          ${legendHTML(t)}
          <div class="read-grid">
            ${L.sentences.map((s, i) => {
              const mine = f[i] || {}, clues = mine.clues || [], c = contextOf(s.text, t);
              return `<div class="read-card ${mine.m && clues.length ? "done" : ""}">
                <div class="no">문장 ${i + 1}</div>
                <div class="read-text">${c.toks.map((tk, k) => c.tIdx.includes(k) ? `<span class="tok is-target">${esc(tk)}</span>`
                  : `<span class="tok ${clues.includes(k) ? "is-clue" : ""} ${state.showWin && c.ctxIdx.has(k) ? "in-win" : ""}" onclick="toggleClue(${i}, ${k})">${esc(tk)}</span>`).join(" ")}</div>
                <div class="read-step">① 단서 말 누르기 ${clues.length ? `<span style="color:#16a34a">(${clues.length}개)</span>` : ""}</div>
                <div class="read-step">② 내가 생각한 뜻</div>
                <div class="m-pick">${L.meanings.map((m, mi) => `<button type="button" class="m-btn ${mine.m === m.id ? "on" : ""}" style="${mine.m === m.id ? `background:${MEANING_COLORS[mi]};border-color:${MEANING_COLORS[mi]}` : ""}" onclick="setFirst(${i}, '${m.id}')">${SHORT[mi]} ${esc(m.name)}</button>`).join("")}</div>
              </div>`;
            }).join("")}
          </div>
        </section>
        ${done < L.sentences.length
          ? `<p class="rule-note" style="margin:-4px 0 16px">문장을 모두 읽고 뜻을 고르면, 컴퓨터는 이 문장을 어떻게 보는지 견주어 볼 수 있어요.</p>`
          : `<div class="ai-card" style="animation:none">
              <div class="face">${state.winAsk ? "🤖" : "🤔"}</div>
              <div class="say">${!state.winAsk
                ? `여러분은 '${esc(t)}' 앞뒤를 살펴 읽고 뜻을 짐작했어요. 그럼 <b>컴퓨터가 나처럼 주변을 살펴 읽게 하는 장치</b>는 무엇일까요?`
                : `바로 <b>윈도우</b>예요. 윈도우는 제가 목표 낱말 양옆으로 몇 칸까지 살펴 읽을지 정하는 창문이에요. 이 앱에서는 사람이 <b>양옆 ${WINDOW}칸</b>으로 정해 두었어요.<br>` +
                  (state.showWin ? winCompare(t) : `여러분은 문장 전체를 읽고 단서를 골랐지요? 내가 고른 단서가 제 윈도우 안에 들어 있을까요?`)}</div>
              ${!state.winAsk
                ? `<button type="button" onclick="answerWin()">💡 답 보기</button>`
                : `<button type="button" onclick="toggleShowWin()">${state.showWin ? "윈도우 숨기기" : "👀 윈도우 보기"}</button>`}
            </div>`}
        ${frameHTML(1, "1단계 정리: 사람과 AI 견주기")}
        <div class="bottom-area"><button type="button" class="next-btn" onclick="switchStage(2)">다음 단계 (문맥 단서 세기) →</button></div>`;
    }
    function toggleClue(i, k) { const f = sub("first", state.currentTarget); const c = f[i] || (f[i] = { m: null, clues: [] }); c.clues = c.clues.includes(k) ? c.clues.filter(x => x !== k) : [...c.clues, k].sort((a, b) => a - b); saveState(); keepScrollRender(); }
    function setFirst(i, id) { const f = sub("first", state.currentTarget); const c = f[i] || (f[i] = { m: null, clues: [] }); c.m = c.m === id ? null : id; saveState(); keepScrollRender(); }
    function winCompare(t) {
      const f = state.first[t] || {};
      let all = 0, inside = 0;
      LEXICON[t].sentences.forEach((s, i) => { const c = contextOf(s.text, t); ((f[i] && f[i].clues) || []).forEach(k => { all++; if (c.ctxIdx.has(k)) inside++; }); });
      if (!all) return "파란 밑줄이 제 윈도우예요. 단서 말을 누르면 제 윈도우와 견주어 볼 수 있어요.";
      return `파란 밑줄이 제 윈도우예요. 내가 고른 단서 <b>${all}개 중 ${inside}개</b>가 제 윈도우 안에 있어요.` + (inside < all ? " 윈도우 밖의 단서는 저는 보지 못해요." : " 모두 제 윈도우 안에 있네요!");
    }
    function answerWin() { state.winAsk = true; saveState(); keepScrollRender(); }
    function toggleShowWin() { state.showWin = !state.showWin; saveState(); keepScrollRender(); }

    /* ===== 2단계: 문맥 단서 세기 ===== */
    function orderOf(t) {
      const n = LEXICON[t].sentences.length;
      const o = state.order[t];
      if (!Array.isArray(o) || o.length !== n) state.order[t] = [...Array(n).keys()];
      return state.order[t];
    }

    function renderStage2() {
      const t = state.currentTarget, sc = sceneOf(t);
      const scenes = ["① 문장마다 펼쳐 모으기", "② 덩어리마다 한 줄로 합치기"];
      return `${headerHTML(2)}${aiCardHTML(2)}${toolsHTML()}
        <section class="panel">
          <div class="scene-nav">${scenes.map((s, i) => `<button type="button" class="scene-btn ${sc === i ? "active" : ""}" onclick="setScene(${i})">${s}</button>`).join("")}</div>
          <div id="s2msg" class="s2-msg"></div>
          ${sc === 0 ? `<div class="btn-group" style="margin-bottom:10px; flex-wrap:wrap">
              <button type="button" class="action-btn" onclick="resetRows()">↩️ 처음으로</button></div>` : ""}
          <div class="s2-wrap" id="s2wrap"><table class="s2" id="s2table"></table></div>
          ${sc === 1 ? `<div class="btn-group" style="margin:12px 0 0">
              <button type="button" class="action-btn ${(state.showChain || {})[t] ? "" : "primary"}" onclick="toggleChain()">${(state.showChain || {})[t] ? "📄 문장 숨기기" : "📄 문장 보기"}</button></div>
            ${(state.showChain || {})[t] ? `<div class="chain-title">🔗는 위 줄과 1이 겹친 옆 말이에요.</div>
              <div class="s2-wrap"><table class="s2" id="s2chain"></table></div>` : ""}` : ""}
          <p class="rule-note">숫자는 낱말 양옆 ${WINDOW}칸 안에 그 말이 <b>함께 나온 횟수</b>예요. ★는 내가 1단계에서 고른 단서예요.${sc === 0 ? " ▲▼를 누르거나 ⋮⋮를 끌어 줄을 옮겨요." : ""}</p>
        </section>
        ${frameHTML(2, "2단계 정리: 사람과 AI 견주기")}
        <div class="bottom-area"><button type="button" class="next-btn" onclick="switchStage(3)">다음 단계 (뜻 추론하기) →</button></div>`;
    }

    function drawS2Table() {
      const t = state.currentTarget, sc = sceneOf(t), L = LEXICON[t], C = sentCtx(t);
      const tbl = document.getElementById("s2table"), msg = document.getElementById("s2msg");
      if (!tbl) return;
      const clues = myClueWords(t), groups = computeGroups(t);
      let rows = [];
      if (sc === 0) rows = orderOf(t).map(i => ({ idx: i, label: `<span class="row-sen">${i + 1}. ${sentHTML(t, L.sentences[i].text)}</span>`, words: C[i], cls: "one" }));
      if (sc === 1) rows = groups.map((g, gi) => ({ label: `<span class="group-tag" style="background:${GROUP_COLORS[gi]}">${esc(t)} · ${esc(groupLabel(t, gi))}</span> <span class="row-sen">(문장 ${g.map(i => i + 1).join(", ")})</span>`, words: g.flatMap(i => C[i]), cls: "one", color: GROUP_COLORS[gi] }));
      // 칸 순서: 지금 줄 순서에서 처음 나오는 차례 → 모이면 덩어리 모양이 보인다
      const cols = []; rows.forEach(r => r.words.forEach(w => { if (!cols.includes(w)) cols.push(w); }));
      const count = {}; C.forEach(ws => [...new Set(ws)].forEach(w => { count[w] = (count[w] || 0) + 1; }));
      let html = `<thead><tr><th>${sc === 0 ? "문장 (줄 옮기기)" : "목표 낱말"}</th>${cols.map(c => `<th class="${clues.includes(c) ? "clue-col" : count[c] > 1 ? "shared" : ""}">${clues.includes(c) ? "★" : ""}${esc(c)}</th>`).join("")}</tr></thead><tbody>`;
      rows.forEach((r, k) => {
        const v = {}; r.words.forEach(w => { v[w] = (v[w] || 0) + 1; });
        html += `<tr data-k="${k}" class="${dragK === k ? "dragging" : ""}"><td><div class="row-label">
          ${sc === 0 ? `<span class="handle" data-k="${k}">⋮⋮</span><span class="mv-box"><button class="mv" onclick="moveRow(${k},-1)">▲</button><button class="mv" onclick="moveRow(${k},1)">▼</button></span>` : ""}${r.label}</div></td>
          ${cols.map(c => `<td class="${v[c] ? (r.color ? "" : r.cls) : ""}" style="${v[c] && r.color ? `background:${r.color}22;color:${r.color};font-weight:800` : ""}">${v[c] || 0}</td>`).join("")}</tr>`;
      });
      tbl.innerHTML = html + "</tbody>";
      if (msg) {
        msg.className = "s2-msg";
        msg.style.display = sc === 0 ? "none" : "";
        const nWord = ["한", "두", "세", "네", "다섯", "여섯"][groups.length - 1] || groups.length;
        if (sc === 1) msg.innerHTML = (state.showChain || {})[t]
          ? `🤖 저는 <b>0과 1 모양이 닮은 줄끼리</b> 모았어요. 뜻이 다른 문장끼리 잘 나뉘었나요?`
          : `🤖 컴퓨터는 왜 '${esc(t)}'를 <b>${nWord} 덩어리</b>로 나눴을까요? <b>[문장 보기]</b>를 눌러 0과 1 모양을 살펴보세요.`;
      }
      drawChainTable();
    }

    // ② [문장 보기]: 컴퓨터가 모은 순서로 줄을 놓고, 위 줄과 1이 겹친 옆 말이 있으면 🔗 표시
    function drawChainTable() {
      const t = state.currentTarget, tbl = document.getElementById("s2chain");
      if (!tbl) return;
      const L = LEXICON[t], C = sentCtx(t), order = computeGroups(t).flatMap(g => bestChain(t, g));
      const cols = []; order.forEach(i => C[i].forEach(w => { if (!cols.includes(w)) cols.push(w); }));
      let html = `<thead><tr><th>문장</th>${cols.map(c => `<th>${esc(c)}</th>`).join("")}</tr></thead><tbody>`;
      order.forEach((i, k) => {
        const prev = k > 0 ? order[k - 1] : null, link = prev !== null && shareWord(C[prev], C[i]);
        const sharedW = link ? [...new Set(C[i].filter(w => C[prev].includes(w)))] : [];
        const v = {}; C[i].forEach(w => { v[w] = (v[w] || 0) + 1; });
        html += `<tr class="${link ? "link" : k > 0 ? "gap" : ""}"><td>${link ? `<div class="link-tag">🔗 ${sharedW.map(esc).join(", ")}</div>` : ""}<div class="row-label"><span class="row-sen">${i + 1}. ${sentHTML(t, L.sentences[i].text)}</span></div></td>
          ${cols.map(c => `<td class="${v[c] ? "one" : ""}">${v[c] || 0}</td>`).join("")}</tr>`;
      });
      tbl.innerHTML = html + "</tbody>";
    }
    // 덩어리 안에서 위아래 줄이 가장 많이 이어지는 순서 (문장 수가 적어 모두 따져 본다)
    function bestChain(t, g) {
      const C = sentCtx(t);
      let best = g, bestLinks = -1;
      const perm = (arr, used) => {
        if (arr.length === g.length) {
          let l = 0; for (let k = 1; k < arr.length; k++) if (shareWord(C[arr[k - 1]], C[arr[k]])) l++;
          if (l > bestLinks) { bestLinks = l; best = [...arr]; }
          return;
        }
        if (bestLinks === g.length - 1) return;
        g.forEach(i => { if (!used.has(i)) { used.add(i); arr.push(i); perm(arr, used); arr.pop(); used.delete(i); } });
      };
      if (g.length <= 8) perm([], new Set());
      return best;
    }
    function toggleChain() { const s = state.showChain || (state.showChain = {}); s[state.currentTarget] = !s[state.currentTarget]; saveState(); keepScrollRender(); }

    let dragK = null;
    function bindS2Drag() {
      const wrap = document.getElementById("s2wrap");
      if (!wrap) return;
      wrap.addEventListener("pointerdown", e => {
        const h = e.target.closest(".handle");
        if (!h) return;
        dragK = Number(h.dataset.k);
        wrap.setPointerCapture(e.pointerId);
        drawS2Table();
        e.preventDefault();
      });
      wrap.addEventListener("pointermove", e => {
        if (dragK === null) return;
        const el = document.elementFromPoint(e.clientX, e.clientY);
        const tr = el && el.closest("tr[data-k]");
        if (!tr) return;
        const k = Number(tr.dataset.k);
        if (k !== dragK) { const o = orderOf(state.currentTarget); const [x] = o.splice(dragK, 1); o.splice(k, 0, x); dragK = k; drawS2Table(); }
      });
      const end = e => { if (dragK === null) return; dragK = null; try { wrap.releasePointerCapture(e.pointerId); } catch (er) {} saveState(); drawS2Table(); };
      wrap.addEventListener("pointerup", end);
      wrap.addEventListener("pointercancel", end);
    }
    function moveRow(k, d) { const o = orderOf(state.currentTarget), j = k + d; if (j < 0 || j >= o.length) return; [o[k], o[j]] = [o[j], o[k]]; saveState(); drawS2Table(); }
    // 처음으로: 문장을 처음 순서(1, 2, 3 …)로 되돌린다
    function resetRows() { state.order[state.currentTarget] = [...Array(LEXICON[state.currentTarget].sentences.length).keys()]; saveState(); drawS2Table(); }
    function setScene(i) { state.scene[state.currentTarget] = i; saveState(); keepScrollRender(); }
    // 장면 번호 (예전 '한 줄로 세기'를 뺀 뒤): 0 펼쳐 모으기 · 1 합치기
    function sceneOf(t) { const v = state.sceneV2 ? state.scene[t] : (state.scene[t] === 2 ? 1 : 0); return v === 1 ? 1 : 0; }

    /* ===== 3·4단계: 단어 지도, 이름표, 점검 ===== */
    function chipW(text, px) { return text.length * px + 40; }
    function allContextWords(t) { const ws = []; sentCtx(t).forEach(c => c.forEach(w => { if (!ws.includes(w)) ws.push(w); })); return ws; }

    let lastMapW = 900;
    function isNarrow(W) { return W < 640; }
    // 덩어리 자리: 넓은 화면은 가로로, 좁은 화면(휴대폰)은 세로로 늘어놓는다
    function groupCenters(t, W) {
      const k = computeGroups(t).length;
      if (isNarrow(W)) { const band = 76 / k; return computeGroups(t).map((g, gi) => ({ cx: 50, cy: band * gi + band / 2 + 3, tagY: band * gi + 1, rx: [16, 40], ry: [band * 0.2, band * 0.36] })); }
      return computeGroups(t).map((g, gi) => ({ cx: k === 1 ? 50 : 16 + gi * (68 / (k - 1)), cy: 34, tagY: 3, rx: [7, k === 3 ? 13 : 17], ry: [10, 24] }));
    }
    function computeMap(t, W, H, mode) {
      const L = LEXICON[t], C = sentCtx(t), groups = computeGroups(t), words = allContextWords(t), narrow = isNarrow(W);
      const out = {}, items = [];
      const add = (key, x, y, w, pinned, hide) => { out[key] = { x: x - (w / W * 100) / 2, y, hide: !!hide }; if (!hide) items.push({ key, w: w / W * 100, pinned }); };
      const gc = groupCenters(t, W);
      const fs = narrow ? { big: 20, occ: 13, ctx: 11, tag: 13 } : { big: 22, occ: 14, ctx: 12, tag: 15 };
      if (mode === "one") {
        add("big", 50, narrow ? 37 : 34, chipW(t, fs.big), true);
        words.forEach((w, i) => { const a = (i / words.length) * Math.PI * 2; add("c:" + w, 50 + Math.cos(a) * (narrow ? 36 : 38), (narrow ? 37 : 34) + Math.sin(a) * (narrow ? 33 : 28), chipW(w, fs.ctx), false); });
        L.sentences.forEach((s, i) => add("o:" + i, 50, 34, chipW(t + "·9", fs.occ), false, true));
        groups.forEach((g, gi) => add("g:" + gi, gc[gi].cx, gc[gi].tagY, chipW(groupLabel(t, gi), fs.tag), false, true));
      } else {
        add("big", 50, 34, chipW(t, fs.big), false, true);
        groups.forEach((g, gi) => {
          const { cx, cy, tagY, rx, ry } = gc[gi];
          add("g:" + gi, cx, tagY, chipW(groupLabel(t, gi), fs.tag), true);
          g.forEach((i, j) => { const a = (j / g.length) * Math.PI * 2 - Math.PI / 2; add("o:" + i, cx + Math.cos(a) * rx[0], cy + Math.sin(a) * ry[0], chipW(t + "·9", fs.occ), false); });
          const gw = []; g.forEach(i => C[i].forEach(w => { if (!gw.includes(w)) gw.push(w); }));
          gw.forEach((w, j) => { if (out["c:" + w]) return; const a = (j / gw.length) * Math.PI * 2; add("c:" + w, cx + Math.cos(a) * rx[1], cy + Math.sin(a) * ry[1], chipW(w, fs.ctx), false); });
        });
      }
      // 겹친 칩 떼어 놓기
      const chipH = ((narrow ? 34 : 40) / H) * 100;
      for (let it = 0; it < 300; it++) {
        let moved = false;
        for (let a = 0; a < items.length; a++) for (let b = a + 1; b < items.length; b++) {
          const A = items[a], B = items[b], p = out[A.key], q = out[B.key];
          const ox = (A.w + B.w) / 2 + 0.8 - Math.abs((p.x + A.w / 2) - (q.x + B.w / 2));
          const oy = chipH + 1 - Math.abs(p.y - q.y);
          if (ox > 0 && oy > 0) {
            if (A.pinned && B.pinned) continue;
            moved = true;
            const ka = A.pinned ? 0 : B.pinned ? 1 : 0.5, kb = B.pinned ? 0 : A.pinned ? 1 : 0.5;
            if (oy < ox) { const d = (p.y <= q.y ? -1 : 1) * oy; p.y += d * ka; q.y -= d * kb; }
            else { const d = ((p.x + A.w / 2) <= (q.x + B.w / 2) ? -1 : 1) * ox; p.x += d * ka; q.x -= d * kb; }
          }
        }
        items.forEach(itm => { const p = out[itm.key]; p.x = Math.max(0.5, Math.min(99.5 - itm.w, p.x)); p.y = Math.max(1, Math.min(76, p.y)); });
        if (!moved) break;
      }
      return out;
    }

    function renderStage3() {
      const t = state.currentTarget, L = LEXICON[t], groups = computeGroups(t), split = !!state.split[t];
      const names = sub("names", t), allNamed = groups.every((g, gi) => names[gi]);
      const colors = ['#ef4444', '#2563eb', '#16a34a', '#000000', '#eab308', '#8b5cf6'];
      const pos = state.chipPositions[t] || computeMap(t, lastMapW, 580, split ? "split" : "one");
      const f = state.first[t] || {};
      return `${headerHTML(3)}${aiCardHTML(3)}${toolsHTML()}
        <section class="stage2-right" style="margin-bottom:16px">
          <div class="stage2-right-header">
            <div><h2>'${esc(t)}' 단어 지도</h2>
              <p>노란 칩은 '${esc(t)}', 파란 칩은 옆에 나온 말이에요. 칩은 언제나 옮길 수 있고, '펜 쓰기'를 켜면 지도 위에 쓸 수 있어요.</p></div>
            <div class="btn-group">
              ${split ? `<button type="button" class="action-btn" onclick="setSplit(false)">↩️ 한 낱말로 되돌리기</button>`
                : `<button type="button" class="action-btn primary" onclick="setSplit(true)">✂️ 옆 말로 나누기</button>`}
            </div>
          </div>
          <div class="ai-say">${mapSay(t)}</div>
          <div class="drawing-toolbar">
            <button type="button" class="tool-btn ${drawTool === 'pen' ? 'active' : ''}" onclick="togglePenMode('pen')">✏️ 펜 쓰기 ${drawTool === 'pen' ? '(켜짐)' : ''}</button>
            <button type="button" class="tool-btn ${drawTool === 'eraser' ? 'active' : ''}" onclick="togglePenMode('eraser')">🧹 지우개</button>
            <div class="color-picker-wrapper" style="margin-left: 6px;"><span style="font-size: 12px; font-weight:700; color:#64748b;">색상:</span>
              ${colors.map(c => `<span class="color-dot ${drawColor === c && drawTool === 'pen' ? 'active' : ''}" style="background-color: ${c};" onclick="setPenColor('${c}')"></span>`).join("")}</div>
            <div style="display:inline-flex; align-items:center; gap:4px; margin-left:6px;"><span style="font-size:12px; font-weight:700; color:#64748b;">두께:</span>
              <button type="button" class="tool-btn ${drawSize === 2 ? 'active' : ''}" onclick="setPenSize(2)" style="padding: 4px 8px; font-size:12px;">얇게</button>
              <button type="button" class="tool-btn ${drawSize === 5 ? 'active' : ''}" onclick="setPenSize(5)" style="padding: 4px 8px; font-size:12px;">보통</button>
              <button type="button" class="tool-btn ${drawSize === 10 ? 'active' : ''}" onclick="setPenSize(10)" style="padding: 4px 8px; font-size:12px;">두껍게</button></div>
            <button type="button" class="tool-btn" onclick="clearStage2Canvas()" style="margin-left:auto; color:#dc2626; border-color:#fca5a5; padding: 4px 10px; font-size:12px;">🗑️ 필기 지우기</button>
          </div>
          <div class="stage2-workspace-container">
            <div id="chipWorkspace" class="chip-workspace">
              ${split ? `<div class="unknown-zone"><span>❓ 어느 쪽인지 모르는 곳</span></div>` : ""}
              <canvas id="stage2DrawingCanvas" class="drawing-canvas ${drawTool !== 'off' ? 'canvas-active' : ''}"></canvas>
              ${chipHTML("big", `${esc(t)}`, "big", pos)}
              ${groups.map((g, gi) => chipHTML("g:" + gi, esc(groupLabel(t, gi)), "tag", pos, `background:${GROUP_COLORS[gi]}`)).join("")}
              ${L.sentences.map((s, i) => chipHTML("o:" + i, `${esc(t)}<small style="opacity:.7">·${i + 1}</small>`, "occ", pos, `border-color:${GROUP_COLORS[groupOf(t, i)]}`, s.text)).join("")}
              ${allContextWords(t).map(w => chipHTML("c:" + w, esc(w), "ctx", pos)).join("")}
            </div>
          </div>
        </section>

        ${split ? `
        <section class="class-panel">
          <div class="class-head"><div>
            <span class="class-badge">3단계 뜻 추론하기</span>
            <h2>🏷️ 덩어리마다 뜻 이름표를 붙여요</h2></div></div>
          <div class="group-grid">
            ${groups.map((g, gi) => `
              <div class="group-card" style="border-color:${GROUP_COLORS[gi]}">
                <h4><span class="group-tag" style="background:${GROUP_COLORS[gi]}">덩어리 ${GROUP_NAMES[gi]}</span> 문장 ${g.length}개</h4>
                <ul>${g.map(i => `<li><span>${i + 1}. ${sentHTML(t, L.sentences[i].text)}</span>${(f[i] && f[i].m) ? pill(t, f[i].m) : `<span class="mini-pill none">내 뜻 없음</span>`}</li>`).join("")}</ul>
                <div class="m-pick">${L.meanings.map((m, mi) => `<button type="button" class="m-btn ${names[gi] === m.id ? "on" : ""}" style="${names[gi] === m.id ? `background:${MEANING_COLORS[mi]};border-color:${MEANING_COLORS[mi]}` : ""}" onclick="setName(${gi}, '${m.id}')">${SHORT[mi]} ${esc(m.name)}</button>`).join("")}</div>
              </div>`).join("")}
          </div>
          ${allNamed ? `<div class="ai-say" style="margin-top:14px">🤖 사람이 표의 숫자를 보고 ${groups.map((g, gi) => `'<b>${esc(meaningInfo(t, names[gi]).name)}</b>'`).join("이라는 뜻과 ")}이라는 뜻으로 이름표를 붙여 줬어요. 앞으로 저는 숫자가 어느 쪽과 비슷한지에 따라 '${esc(t)}'을(를) 나눠서 읽을 거예요. 하지만 저는 그 뜻을 알지는 못해요.</div>` : ""}
        </section>
        ${frameHTML(3, "3단계 정리: 사람과 AI 견주기")}` : ""}
        <div class="bottom-area"><button type="button" class="next-btn" onclick="switchStage(4)">다음 단계 (추론 점검·수정하기) →</button></div>`;
    }

    function chipHTML(key, inner, cls, pos, style, title) {
      const p = pos[key] || { x: 50, y: 40, hide: true };
      return `<div class="word-chip ${cls} ${p.hide ? "hide" : ""}" data-chip="${key}" ${title ? `title="${esc(title)}"` : ""} style="left:${p.x}%; top:${p.y}%; ${style || ""}">${inner}</div>`;
    }

    function mapSay(t) {
      const groups = computeGroups(t);
      const pred = state.story.predict && t === STORY.check.word ? `📖 글 읽기에서 나는 컴퓨터가 '연패' 두 개를 <b>${state.story.predict === "same" ? "같은 것으로 본다" : "다른 뜻으로 나눈다"}</b>고 예측했어요.<br>` : "";
      if (!state.split[t]) return pred + `🤖 저는 처음에 '${esc(t)}'이(가) 모두 <b>같은 뜻</b>인 줄 알았어요. 그래서 옆에 나온 말들이 '${esc(t)}' 하나에 모두 붙어 있어요. 이 말들이 정말 한 가지 뜻의 단서일까요?`;
      return `🤖 옆에 같은 말이 나온 문장끼리 모았더니 '${esc(t)}'이(가) <b>덩어리 ${groups.length}개</b>로 나뉘었어요. 각 덩어리 옆에는 서로 다른 말들이 모여 있어요.`;
    }

    function setSplit(v) {
      const t = state.currentTarget;
      state.split[t] = v;
      saveState();
      const ws = document.getElementById("chipWorkspace");
      const rect = ws ? ws.getBoundingClientRect() : { width: 900, height: 580 };
      const from = state.chipPositions[t] || computeMap(t, rect.width, rect.height, v ? "one" : "split");
      state.chipPositions[t] = from;
      keepScrollRender();
      setTimeout(() => animateTo(computeMap(t, rect.width, rect.height, v ? "split" : "one")), 60);
    }

    function animateTo(target) {
      const t = state.currentTarget;
      const keep = state.chipPositions[t] && state.chipPositions[t].new;
      state.chipPositions[t] = { ...target };
      if (keep) state.chipPositions[t].new = keep;
      saveState();
      document.querySelectorAll("#chipWorkspace .word-chip").forEach(chip => {
        const p = target[chip.dataset.chip];
        if (!p) return;
        chip.classList.add("animate");
        chip.classList.toggle("hide", !!p.hide);
        chip.style.left = p.x + "%";
        chip.style.top = p.y + "%";
        setTimeout(() => chip.classList.remove("animate"), 1000);
      });
    }

    function setName(gi, id) {
      const t = state.currentTarget, n = sub("names", t);
      n[gi] = n[gi] === id ? undefined : id;
      saveState();
      keepScrollRender();
      const ws = document.getElementById("chipWorkspace");
      if (ws) { const r = ws.getBoundingClientRect(); const m = computeMap(t, r.width, r.height, "split"); animateTo({ ...state.chipPositions[t], ["g:" + gi]: m["g:" + gi] }); }
    }

    // 받침에 따라 조사 고르기: josa('입장', '을', '를') → '을'
    function josa(word, a, b) { const c = String(word || "").slice(-1).charCodeAt(0); if (c < 0xAC00 || c > 0xD7A3) return b; return (c - 0xAC00) % 28 ? a : b; }

    /* ----- 4단계 새 어구 점검 (계획서 5차시 4단계, 설계원리 2: 학생 혼자 점검·수정) -----
       ① 내가 먼저 뜻을 고른다 → ② [컴퓨터는?] 컴퓨터의 판단을 본다
       (본 적 있는 옆 말 → "○○ 문장들에서 본 적이 있어서 ○○일 것 같아요" / 여러 덩어리 → "헷갈려요" / 처음 보는 말 → "모르겠어요")
       → ③ 내 생각을 그대로 둘지 고칠지 정하고 근거를 쓴다 → 정답 확인 (나 ✅/❌, 컴퓨터 ✅/❌/못 고름) */
    function chkOf(t) { const c = state.check4[t] || (state.check4[t] = {}); if (!c.items) { c.items = {}; c.cur = 0; } return c; }
    function chkItem(t, i) { const c = chkOf(t); return c.items[i] || (c.items[i] = {}); }
    function curChk() {
      const t = state.currentTarget, c = chkOf(t), i = Math.max(0, Math.min(c.cur || 0, LEXICON[t].checks.length - 1));
      return { t, i, s: LEXICON[t].checks[i], it: chkItem(t, i) };
    }
    // 덩어리가 실제로 어떤 뜻의 문장으로 이루어졌는지 (정답 확인에만 씀. 컴퓨터는 이것을 모른다)
    function groupTrueMeaning(t, gi) {
      const cnt = {};
      (computeGroups(t)[gi] || []).forEach(i => { const m = LEXICON[t].sentences[i].m; cnt[m] = (cnt[m] || 0) + 1; });
      return Object.keys(cnt).sort((a, b) => cnt[b] - cnt[a])[0] || null;
    }
    // 덩어리 이름: 3단계에서 학생이 붙인 뜻 이름표가 있으면 그것, 없으면 '덩어리 가'
    function groupCall(t, gi) { const mi = meaningInfo(t, (state.names[t] || {})[gi]); return mi ? `'${mi.name}'` : `덩어리 ${GROUP_NAMES[gi]}`; }
    function computerSays(t, text) {
      const j = judgeNew(t, text), q = ws => [...new Set(ws)].map(w => `'${esc(w)}'`).join(", ");
      if (j.kind === "unknown") return { j, html: `옆 말 ${q(j.ctx) || "없음"}은(는) 처음 봐요. 그래서 <b>모르겠어요.</b>` };
      if (j.kind === "tie") return { j, html: `${q(j.tops.flatMap(g => j.hits[g]))}을(를) ${j.tops.map(g => groupCall(t, g)).join(" · ")} 문장들에서 모두 봤어요. 그래서 <b>헷갈려요.</b>` };
      return { j, html: `${q(j.hits[j.group])}을(를) ${groupCall(t, j.group)} 문장들에서 본 적이 있어요. 그래서 <b>${groupCall(t, j.group)}일 것 같아요.</b>` };
    }
    function chkFinalMeaning(it) { return it.keep === "keep" ? it.first : it.keep === "change" ? it.final : null; }
    let chkErr = "";
    function renderStage4() {
      const { t, i: cur, s, it } = curChk(), L = LEXICON[t];
      if (!s) return `${headerHTML(4)}${toolsHTML()}<section class="class-panel"><p class="rule-note">이 낱말에는 점검 어구가 없어요.</p></section>`;
      const c = it.revealed ? computerSays(t, s.text) : null, finalM = chkFinalMeaning(it), ctx = contextOf(s.text, t);
      const sent = ctx.toks.map((x, k) => ctx.tIdx.includes(k) ? `<span class="tok is-target">${esc(x)}</span>`
        : `<span class="tok ${it.revealed && ctx.ctxIdx.has(k) ? "in-win" : ""}" style="cursor:default">${esc(x)}</span>`).join(" ");

    }
    function chkFirst(id) { const { it } = curChk(); if (it.revealed) return; it.first = it.first === id ? null : id; saveState(); keepScrollRender(); }

    /* ===== 🧭 마무리 ===== */

    /* ===== 마무리: 나의 읽기 순서 ===== */
    // 사람의 읽기 순서 (모형 2단계 '문맥 단서 세기'는 컴퓨터의 방법이라 넣지 않음)
    const WRAP_STEPS = [
      { k: 1, name: "문맥 살피기", say: "낱말 앞뒤를 살펴 읽어요" },

    function wrapStep(k) { return WRAP_STEPS.find(s => s.k === k); }

          ${w.order.length === WRAP_STEPS.length && !done ? `<button type="button" class="big-btn" style="margin-top:10px" onclick="wrapCheck()">✔ 확인</button>` : ""}

          <div class="step-title">① 주변 단어 다시 살피기 — 뜻을 알려 주는 말을 눌러 밑줄을 그어요</div>

              <div class="m-pick">${LEXICON[w].meanings.map((m, mi) => `<button type="button" class="m-btn sm ${mean[o.id] === m.id ? "on" : ""}" style="${mean[o.id] === m.id ? `background:${MEANING_COLORS[mi]};border-color:${MEANING_COLORS[mi]}` : ""}" onclick="setBackMean('${o.id}','${m.id}')">${SHORT[mi]} ${esc(m.name)}</button>`).join("")}</div></div>`).join("")}` : ""}

    /* ===== 기록 보내기 (구글 Apps Script로 열었을 때) ===== */

        });

        });
      });

      TARGETS.forEach(w => {
        occsOf(w).forEach((o, i) => {

      });

      rows.forEach(r => { r.school = state.school; r.frames = [1, 2, 3].map(k => state.frames[k] || "").join(" / "); r.predict = s.predict === "same" ? "같은 것으로 본다" : s.predict === "diff" ? "다른 뜻으로 나눈다" : ""; });

    function sendRecords() {

    /* ===== 펜·지우개, 칩 끌기 (앱 2와 같음) ===== */

    function initStage2DrawingCanvas() {

      stage2Ctx = stage2Canvas.getContext("2d");
      const rect = workspace.getBoundingClientRect(), w = Math.max(rect.width, 300), h = Math.max(rect.height, 580);
      if (stage2Canvas.width !== w || stage2Canvas.height !== h) { stage2Canvas.width = w; stage2Canvas.height = h; if (drawingBufferCanvas.width === 0) { drawingBufferCanvas.width = w; drawingBufferCanvas.height = h; } }
      stage2Ctx.drawImage(drawingBufferCanvas, 0, 0);
      let isDrawing = false, lastX = 0, lastY = 0;
      const getCoords = e => { const c = stage2Canvas.getBoundingClientRect(); const x = e.touches ? e.touches[0].clientX : e.clientX, y = e.touches ? e.touches[0].clientY : e.clientY; return { x: x - c.left, y: y - c.top }; };
      const start = e => { if (drawTool === 'off') return; isDrawing = true; const c = getCoords(e); lastX = c.x; lastY = c.y; };
      const draw = e => {
        if (!isDrawing || drawTool === 'off') return;
        e.preventDefault();
        const c = getCoords(e);
        const go = ctx => { ctx.beginPath(); ctx.moveTo(lastX, lastY); ctx.lineTo(c.x, c.y);
          if (drawTool === 'eraser') { ctx.globalCompositeOperation = 'destination-out'; ctx.lineWidth = drawSize * 5; } else { ctx.globalCompositeOperation = 'source-over'; ctx.strokeStyle = drawColor; ctx.lineWidth = drawSize; }
          ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.stroke(); };
        go(stage2Ctx);
        if (drawingBufferCanvas.width !== stage2Canvas.width || drawingBufferCanvas.height !== stage2Canvas.height) {
          const tmp = document.createElement("canvas"); tmp.width = drawingBufferCanvas.width; tmp.height = drawingBufferCanvas.height; tmp.getContext("2d").drawImage(drawingBufferCanvas, 0, 0);
          drawingBufferCanvas.width = stage2Canvas.width; drawingBufferCanvas.height = stage2Canvas.height; drawingBufferCtx.drawImage(tmp, 0, 0);
        }
        go(drawingBufferCtx);
        lastX = c.x; lastY = c.y;
      };
      const stop = () => { isDrawing = false; };
      stage2Canvas.addEventListener('mousedown', start); stage2Canvas.addEventListener('mousemove', draw); stage2Canvas.addEventListener('mouseup', stop); stage2Canvas.addEventListener('mouseleave', stop);
      stage2Canvas.addEventListener('touchstart', start, { passive: false }); stage2Canvas.addEventListener('touchmove', draw, { passive: false }); stage2Canvas.addEventListener('touchend', stop);
    }
    function bindChipDrag() {
      const ws = document.getElementById("chipWorkspace");
      if (!ws) return;
      let active = null, sx = 0, sy = 0, il = 0, it = 0;
      ws.querySelectorAll(".word-chip").forEach(chip => {
        chip.addEventListener("pointerdown", e => { if (chip.classList.contains("hide")) return; active = chip; chip.classList.add("is-dragging"); chip.setPointerCapture(e.pointerId); const r = chip.getBoundingClientRect(), pr = ws.getBoundingClientRect(); sx = e.clientX; sy = e.clientY; il = r.left - pr.left; it = r.top - pr.top; e.preventDefault(); });
        chip.addEventListener("pointermove", e => {
          if (active !== chip) return;
          const pr = ws.getBoundingClientRect(), cr = chip.getBoundingClientRect();
          const px = Math.max(0, Math.min(pr.width - cr.width, il + e.clientX - sx)) / pr.width * 100;
          const py = Math.max(0, Math.min(pr.height - cr.height, it + e.clientY - sy)) / pr.height * 100;
          chip.style.left = px + "%"; chip.style.top = py + "%";
          const t = state.currentTarget; if (!state.chipPositions[t]) state.chipPositions[t] = {};
          state.chipPositions[t][chip.dataset.chip] = { x: +px.toFixed(2), y: +py.toFixed(2) };
        });
        const rel = e => { if (active !== chip) return; chip.classList.remove("is-dragging"); try { chip.releasePointerCapture(e.pointerId); } catch (er) {} active = null; saveState(); };
        chip.addEventListener("pointerup", rel); chip.addEventListener("pointercancel", rel);
      });
    }

    /* ===== 화면 그리기 ===== */
    function switchStage(n) { state.currentStage = n; saveState(); render(); window.scrollTo({ top: 0, behavior: "auto" }); }
    function keepScrollRender() { const y = window.scrollY; render(); window.scrollTo({ top: y }); }
    function bindTextInputs() {
      document.querySelectorAll("[data-frame]").forEach(el => el.addEventListener("input", e => { state.frames[e.target.dataset.frame] = e.target.value; saveState(); }));
      document.querySelectorAll("[data-samewhy]").forEach(el => el.addEventListener("input", e => { storySub("sameWhy")[e.target.dataset.samewhy] = e.target.value; saveState(); }));
      document.querySelectorAll("[data-meanwhy]").forEach(el => el.addEventListener("input", e => { storySub("meanWhy")[e.target.dataset.meanwhy] = e.target.value; saveState(); }));
      document.querySelectorAll("[data-backwhy]").forEach(el => el.addEventListener("input", e => { R().why = e.target.value; saveState(); }));
      document.querySelectorAll("[data-wrapline]").forEach(el => el.addEventListener("input", e => { W().line = e.target.value; saveState(); }));
      document.querySelectorAll("[data-chkwhy]").forEach(el => el.addEventListener("input", e => { storySub("chk").why = e.target.value; saveState(); }));
    }
    function render() {
      const app = document.getElementById("app");
      const a = document.activeElement;
      const keepId = a && a.id && (a.tagName === "TEXTAREA" || a.tagName === "INPUT") ? a.id : null;
      const s0 = keepId ? a.selectionStart : 0, s1 = keepId ? a.selectionEnd : 0;
      const s = state.currentStage;
      if (forceStart || (!state.started && !state.studentNo)) { app.innerHTML = renderStart(); const el = document.getElementById(state.school ? "startNo" : "startSchool"); if (el) el.focus(); return; }
      app.innerHTML = s === 0 ? renderStory() : s === 1 ? renderStage1() : s === 2 ? renderStage2() : s === 3 ? renderStage3() : s === 4 ? renderStage4() : renderStage5();
      if (s === 2) { drawS2Table(); bindS2Drag(); }
      if (s === 3) {
        const t = state.currentTarget, ws = document.getElementById("chipWorkspace");
        if (ws) lastMapW = ws.getBoundingClientRect().width || lastMapW;
        if (ws && !state.chipPositions[t]) { const r = ws.getBoundingClientRect(); state.chipPositions[t] = computeMap(t, r.width, r.height, state.split[t] ? "split" : "one"); saveState(); render(); return; }
        bindChipDrag(); initStage2DrawingCanvas();
      }
      bindTextInputs();
      if (keepId) { const el = document.getElementById(keepId); if (el) { el.focus(); try { el.setSelectionRange(s0, s1); } catch (e) {} } }
    }
    syncLexSig();
    if (!HAS_SERVER && location.hash === "#start") { forceStart = true; try { history.replaceState(null, "", location.pathname); } catch (e) {} }
    render();
    if (HAS_SERVER && google.script.url) google.script.url.getLocation(loc => { if (loc && loc.parameter && loc.parameter.start) { forceStart = true; render(); } });
    loadLexicon();
    if (HAS_SERVER) { loadVotes(); setInterval(loadVotes, 15000); }
  </script>
