<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>학생 활동 · 문맥 추론</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: #f5f7fb; color: #1f2937; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", sans-serif; }
    header { background: #24357a; color: white; padding: 22px 18px; }
    header > div, main { width: min(900px, 100%); margin: 0 auto; }
    h1 { margin: 0; font-size: clamp(24px, 5vw, 34px); }
    header p { margin: 6px 0 0; color: #dbe3ff; }
    main { padding: 24px 18px 48px; }
    .card { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; padding: 18px; margin: 12px 0; background: white; border: 1px solid #dfe4ee; border-radius: 14px; text-decoration: none; color: inherit; box-shadow: 0 3px 12px #24357a0d; }
    .card:hover { border-color: #24357a; transform: translateY(-1px); }
    .card b { display: block; font-size: 19px; }
    .card span { color: #64748b; font-size: 14px; }
    .arrow { color: #24357a; font-size: 23px; font-weight: 800; }
    .teacher { display: inline-block; margin-top: 20px; color: #475569; font-size: 14px; }
    @media (max-width: 520px) { main { padding: 16px 12px 32px; } .card { padding: 14px; } }
  </style>
</head>
<body>
  <header><div>
    <h1>문맥 추론 활동</h1>
    <p>아래에서 선생님이 안내한 활동을 열어 보세요.</p>
  </div></header>
  <main>
    <a class="card" href="apps/app1.html">
      <div><b>앱 1 · 단어만 같으면 뜻도 같을까?</b><span>단어 가방과 0·1 표로 컴퓨터의 판단을 살펴봐요.</span></div><div class="arrow">→</div>
    </a>
    <a class="card" href="apps/app2.html">
      <div><b>앱 2 · 주변 단어는 어떤 단서가 될까?</b><span>옆에 함께 나온 말을 세어 뜻의 단서를 찾아봐요.</span></div><div class="arrow">→</div>
    </a>
    <a class="card" href="apps/app3.html">
      <div><b>앱 3 · 같은 낱말, 옆 말로 뜻을 나눌 수 있을까?</b><span>같은 낱말의 여러 뜻을 주변 단서로 살펴봐요.</span></div><div class="arrow">→</div>
    </a>
    <a class="teacher" href="teacher.html">수업 소개·수업 흐름</a>
  </main>
</body>
</html>
